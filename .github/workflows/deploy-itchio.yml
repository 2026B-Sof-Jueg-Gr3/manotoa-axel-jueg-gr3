# ============================================================
#  CI/CD — Despliegue automático a Itch.io
#  ------------------------------------------------------------
#  Cada push a main empaqueta el juego y lo sube a Itch.io
#  usando Butler (la CLI oficial de itch.io).
#
#  Requisitos (configurar una sola vez):
#    1. Crear cuenta en https://itch.io y el proyecto del juego
#    2. Settings > API keys > generar una nueva key
#    3. En GitHub: Settings > Secrets and variables > Actions
#       - ITCHIO_API_KEY  = la key generada
#       - ITCHIO_USERNAME = tu usuario de itch.io (ej: axel-manotoa)
#       - ITCHIO_GAME     = slug del juego (ej: neon-breaker)
#
#  Después de eso, cada git push a main publica el juego solo.
# ============================================================

name: Deploy to Itch.io

on:
  push:
    branches: [main]

  # Permite dispararlo manualmente desde la pestaña Actions
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Clonar el repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Empaquetar el juego
      #    Incluye index.html, game.js, js/, docs/ y juego/ para que funcione
      #    tanto la landing page como el canvas de Phaser.
      - name: Pack game files
        run: |
          mkdir -p dist
          cp -r index.html juego js game.js docs dist/
          ls -R dist

      # 3. Instalar Butler directamente desde el mirror oficial actual
      #    (la acción comunitaria josephbmanley/butler-publish-itchio-action@v1.0.3
      #    está rota porque apunta al dominio antiguo broth.itch.ovh).
      - name: Install Butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          sudo mv butler /usr/local/bin/butler
          butler --version

      # 4. Iniciar sesión y subir a Itch.io
      - name: Push to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCHIO_API_KEY }}
        run: |
          butler push dist ${{ secrets.ITCHIO_USERNAME }}/${{ secrets.ITCHIO_GAME }}:web --userversion "${{ github.sha }}"
